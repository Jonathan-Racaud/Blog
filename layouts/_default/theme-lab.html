<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} · {{ .Site.Title }}</title>
  <meta name="description" content="{{ .Params.description }}">
  <link rel="stylesheet" href="{{ "css/theme-lab.css" | relURL }}">
</head>
<body>
  <div class="shell">
    <header class="chrome">
      <a class="brand" href="{{ .Site.Home.RelPermalink }}">J<span>Racaud</span></a>
      <nav class="nav" aria-label="Main navigation">
        {{ range .Site.Menus.nav }}
        <a class="nav-link" href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
        <a class="nav-link is-active" href="{{ .RelPermalink }}" aria-current="page">Lab</a>
      </nav>
      <div class="status" aria-hidden="true">
        <span class="led"></span>
        <span class="status-text">SYS OK</span>
      </div>
    </header>

    <main class="panel">
      <div class="panel-head">
        <span class="panel-label">PANEL · R1</span>
        <span class="panel-label">LIGHT MODE</span>
      </div>
      <article class="content">
        {{ .Content }}
      </article>
    </main>

    <footer class="footer">
      <span>© {{ now.Format "2006" }} {{ .Site.Title }}</span>
      <a href="#top">↑ TOP</a>
    </footer>
  </div>
</body>
</html>
